version: "3.9"

services:
  web1:
    build:
      context: ./web
    container_name: web1
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
    networks:
      - backend
    expose:
      - "5000"

  web2:
    build:
      context: ./web
    container_name: web2
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
    networks:
      - backend
    expose:
      - "5000"

  redis:
    image: redis:latest
    container_name: redis
    networks:
      - backend
    volumes:
      - redis-data:/data

  nginx:
    build:
      context: ./nginx
    container_name: nginx
    depends_on:
      - web1
      - web2
    ports:
      - "8080:80"
    networks:
      - backend
      - frontend

volumes:
  redis-data:

networks:
  backend:
  frontend: